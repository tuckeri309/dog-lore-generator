<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Random Dog Lore-n-ator-2000</h1>
        <p>Generate a random dog, then generate some dog lore based on the image!</p>
        <div class="dog-container">
            <img id="dogImage" src="" alt="Random Dog">
            <p id="dogLore"></p>
        </div>
        <div class="button-container">
            <button id="generateDogButton">Generate Dog</button>
            <button id="generateDogLoreButton">Generate Dog Lore</button>
        </div>
    </div>
    <script type="module" src="dog.js"></script>
</body>
</html>
